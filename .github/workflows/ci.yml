name: Verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verificar instalação
        run: python -m pip check
      - name: Testes automatizados
        run: python -B -m unittest discover -s tests -v
      - name: Teste em navegador
        run: |
          python -B tests/browser_smoke.py
          python -B tests/browser_smoke.py --manual-only
          python -B tests/browser_smoke.py --refinements
          python -B tests/browser_smoke.py --delivery-refinements
      - name: Auditoria de dependências
        run: python -m pip_audit -r requirements-lock.txt
